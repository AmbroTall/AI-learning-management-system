{% extends 'base.html' %}

{% block title %}Reset Password - LearnPulse{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full">
        <div class="glass-effect rounded-2xl p-8 neon-border">
            <h2 class="text-3xl font-bold mb-2 gradient-text text-center">Forgot Password?</h2>
            <p class="text-gray-400 text-center mb-8">Enter your email and we'll send you a reset link</p>

            <form method="POST" class="space-y-6">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium mb-2 text-gray-300">Email</label>
                    <input type="email" name="email" required
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg focus:outline-none focus:border-cyan-500 text-white"
                           placeholder="you@example.com">
                </div>

                <button type="submit"
                        class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-500 rounded-lg font-semibold hover-lift neon-border">
                    Send Reset Link
                </button>
            </form>

            <p class="text-center mt-6 text-gray-400">
                Remembered it? <a href="{% url 'login' %}" class="text-cyan-400 hover:text-cyan-300">Sign in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
