{% extends 'base.html' %}

{% block title %}Password Reset - LearnPulse{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full">
        <div class="glass-effect rounded-2xl p-8 neon-border text-center">
            <div class="text-5xl mb-4">✅</div>
            <h2 class="text-2xl font-bold mb-2 gradient-text">Password Reset</h2>
            <p class="text-gray-400 mb-6">Your password has been changed. You can sign in now.</p>
            <a href="{% url 'login' %}"
               class="inline-block px-6 py-3 bg-gradient-to-r from-cyan-500 to-blue-500 rounded-lg font-semibold hover-lift neon-border">
                Sign In →
            </a>
        </div>
    </div>
</div>
{% endblock %}
