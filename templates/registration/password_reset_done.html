{% extends 'base.html' %}

{% block title %}Check Your Email - LearnPulse{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full">
        <div class="glass-effect rounded-2xl p-8 neon-border text-center">
            <div class="text-5xl mb-4">📬</div>
            <h2 class="text-2xl font-bold mb-2 gradient-text">Check Your Email</h2>
            <p class="text-gray-400 mb-6">
                If an account exists with that email, we've sent a link to reset your password.
                It may take a few minutes to arrive — check spam too.
            </p>
            <a href="{% url 'login' %}" class="text-cyan-400 hover:text-cyan-300">← Back to sign in</a>
        </div>
    </div>
</div>
{% endblock %}
