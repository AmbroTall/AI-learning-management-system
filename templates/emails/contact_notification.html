<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:32px 16px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" style="max-width:480px;background:#ffffff;border-radius:16px;overflow:hidden;">
                    <tr>
                        <td style="background:linear-gradient(135deg,#22D3EE,#818CF8);padding:28px 32px;">
                            <span style="font-size:20px;font-weight:800;color:#0f172a;">LearnPulse</span>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:32px;">
                            <h1 style="margin:0 0 4px;font-size:22px;color:#0f172a;">New contact message</h1>
                            <p style="margin:0 0 20px;font-size:14px;color:#64748b;">Reply to this email to respond directly to {{ contact_message.name }}.</p>

                            <table role="presentation" width="100%" style="background:#f8fafc;border-radius:10px;padding:4px;margin-bottom:20px;">
                                <tr>
                                    <td style="padding:12px 16px;font-size:14px;color:#64748b;">From</td>
                                    <td style="padding:12px 16px;font-size:14px;color:#0f172a;font-weight:600;text-align:right;">{{ contact_message.name }} &lt;{{ contact_message.email }}&gt;</td>
                                </tr>
                                <tr>
                                    <td style="padding:0 16px 12px;font-size:14px;color:#64748b;">Subject</td>
                                    <td style="padding:0 16px 12px;font-size:14px;color:#0f172a;font-weight:600;text-align:right;">{{ contact_message.subject }}</td>
                                </tr>
                            </table>

                            <p style="margin:0 0 20px;font-size:14px;line-height:1.6;color:#334155;white-space:pre-wrap;">{{ contact_message.message }}</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:16px 32px 28px;border-top:1px solid #e2e8f0;">
                            <p style="margin:0;font-size:12px;color:#94a3b8;">LearnPulse · learnpulse.online</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
