{% extends 'base.html' %}

{% block title %}Register - AI Learning Platform{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full">
        <div class="glass-effect rounded-2xl p-8 neon-border">
            <h2 class="text-4xl font-bold mb-2 gradient-text text-center">Create Account</h2>
            <p class="text-gray-400 text-center mb-8">Start your AI learning journey</p>
            
            <form method="POST" class="space-y-6">
                {% csrf_token %}

                <div style="position:absolute; left:-9999px; top:-9999px;" aria-hidden="true">
                    <label for="website">Leave this field blank</label>
                    <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2 text-gray-300">Username</label>
                    <input type="text" name="username" required 
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg focus:outline-none focus:border-cyan-500 text-white"
                           placeholder="Choose a username">
                </div>
                
                <div>
                    <label class="block text-sm font-medium mb-2 text-gray-300">Email</label>
                    <input type="email" name="email" required 
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg focus:outline-none focus:border-cyan-500 text-white"
                           placeholder="your@email.com">
                </div>
                
                <div>
                    <label class="block text-sm font-medium mb-2 text-gray-300">Password</label>
                    <input type="password" name="password" required 
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg focus:outline-none focus:border-cyan-500 text-white"
                           placeholder="Create a strong password">
                </div>
                
                <div>
                    <label class="block text-sm font-medium mb-2 text-gray-300">Confirm Password</label>
                    <input type="password" name="password2" required 
                           class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-lg focus:outline-none focus:border-cyan-500 text-white"
                           placeholder="Confirm your password">
                </div>
                
                <button type="submit" 
                        class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-500 rounded-lg font-semibold hover-lift neon-border">
                    Create Account
                </button>
            </form>
            
            <p class="text-center mt-6 text-gray-400">
                Already have an account? 
                <a href="{% url 'login' %}" class="text-cyan-400 hover:text-cyan-300">Sign in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
